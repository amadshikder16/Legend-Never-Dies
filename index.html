<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Legend Never Dies - Hadi</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a0a;
      color: white;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #game-container {
      position: relative;
      border: 3px solid #c41e3a;
      box-shadow: 0 0 30px rgba(196, 30, 58, 0.4);
    }
    canvas {
      display: block;
      background: #111;
    }
    #ui {
      position: absolute;
      top: 15px;
      left: 15px;
      font-size: 18px;
      text-shadow: 0 0 8px black;
      pointer-events: none;
    }
    #title {
      font-size: 28px;
      font-weight: bold;
      color: #c41e3a;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    #score, #health {
      margin: 4px 0;
    }
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 42px;
      font-weight: bold;
      color: #c41e3a;
      text-shadow: 0 0 20px rgba(196, 30, 58, 0.8);
      display: none;
      text-align: center;
      pointer-events: none;
    }
    #instructions {
      margin-top: 18px;
      color: #aaa;
      font-size: 14px;
      text-align: center;
    }
    .highlight {
      color: #c41e3a;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <div id="ui">
      <div id="title">LEGEND NEVER DIES</div>
      <div id="score">Score: 0</div>
      <div id="health">Health: 100</div>
    </div>
    <div id="message">LEGEND NEVER DIES</div>
  </div>

  <div id="instructions">
    <span class="highlight">WASD</span> or Arrows to move &nbsp;|&nbsp;
    <span class="highlight">Mouse</span> to aim &amp; shoot &nbsp;|&nbsp;
    Survive as long as you can
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const healthEl = document.getElementById('health');
    const messageEl = document.getElementById('message');

    // Player
    const player = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 18,
      speed: 4.2,
      health: 100,
      color: '#c41e3a'
    };

    // Bullets & Enemies
    let bullets = [];
    let enemies = [];
    let score = 0;
    let gameOver = false;
    let keys = {};
    let mouse = { x: 0, y: 0, down: false };

    // Spawn timer
    let enemyTimer = 0;
    let spawnRate = 90; // lower = faster spawn

    // Event listeners
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
    });

    canvas.addEventListener('mousedown', () => mouse.down = true);
    canvas.addEventListener('mouseup', () => mouse.down = false);

    // Shoot
    function shoot() {
      if (gameOver) return;
      const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
      bullets.push({
        x: player.x,
        y: player.y,
        vx: Math.cos(angle) * 11,
        vy: Math.sin(angle) * 11,
        radius: 5
      });
    }

    // Auto fire while holding mouse
    setInterval(() => {
      if (mouse.down && !gameOver) shoot();
    }, 140);

    // Spawn enemy
    function spawnEnemy() {
      const side = Math.floor(Math.random() * 4);
      let x, y;
      if (side === 0) { x = Math.random() * canvas.width; y = -30; }
      else if (side === 1) { x = canvas.width + 30; y = Math.random() * canvas.height; }
      else if (side === 2) { x = Math.random() * canvas.width; y = canvas.height + 30; }
      else { x = -30; y = Math.random() * canvas.height; }

      enemies.push({
        x, y,
        radius: 16 + Math.random() * 8,
        speed: 1.4 + Math.random() * 1.6,
        color: '#555'
      });
    }

    // Update
    function update() {
      if (gameOver) return;

      // Movement
      if (keys['w'] || keys['arrowup']) player.y -= player.speed;
      if (keys['s'] || keys['arrowdown']) player.y += player.speed;
      if (keys['a'] || keys['arrowleft']) player.x -= player.speed;
      if (keys['d'] || keys['arrowright']) player.x += player.speed;

      // Keep player inside
      player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
      player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

      // Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
          bullets.splice(i, 1);
        }
      }

      // Enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(angle) * e.speed;
        e.y += Math.sin(angle) * e.speed;

        // Hit player
        const dist = Math.hypot(player.x - e.x, player.y - e.y);
        if (dist < player.radius + e.radius) {
          player.health -= 12;
          enemies.splice(i, 1);
          if (player.health <= 0) {
            player.health = 0;
            gameOver = true;
            messageEl.style.display = 'block';
            messageEl.innerHTML = 'LEGEND NEVER DIES<br><span style="font-size:20px;color:#fff">Click to Restart</span>';
          }
        }
      }

      // Bullet hits enemy
      for (let i = enemies.length - 1; i >= 0; i--) {
        for (let j = bullets.length - 1; j >= 0; j--) {
          const dist = Math.hypot(enemies[i].x - bullets[j].x, enemies[i].y - bullets[j].y);
          if (dist < enemies[i].radius + bullets[j].radius) {
            enemies.splice(i, 1);
            bullets.splice(j, 1);
            score += 10;
            break;
          }
        }
      }

      // Spawn enemies
      enemyTimer++;
      if (enemyTimer > spawnRate) {
        spawnEnemy();
        enemyTimer = 0;
        if (spawnRate > 35) spawnRate -= 0.8; // gets harder
      }

      // UI
      scoreEl.textContent = `Score: ${score}`;
      healthEl.textContent = `Health: ${Math.max(0, Math.floor(player.health))}`;
    }

    // Draw
    function draw() {
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle grid
      ctx.strokeStyle = '#1a1a1a';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Bullets
      ctx.fillStyle = '#ffcc00';
      bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // Enemies
      enemies.forEach(e => {
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#888';
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      // Player (Hadi)
      ctx.fillStyle = player.color;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();

      // Player outline
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Aim line
      if (!gameOver) {
        ctx.strokeStyle = 'rgba(196, 30, 58, 0.4)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(mouse.x, mouse.y);
        ctx.stroke();
      }
    }

    // Game loop
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // Restart
    canvas.addEventListener('click', () => {
      if (gameOver) {
        player.health = 100;
        player.x = canvas.width / 2;
        player.y = canvas.height / 2;
        bullets = [];
        enemies = [];
        score = 0;
        spawnRate = 90;
        gameOver = false;
        messageEl.style.display = 'none';
      }
    });

    // Start
    loop();
  </script>
</body>
</html>
